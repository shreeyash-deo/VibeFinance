version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vibefinance-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vibefinance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vibefinance-api
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/vibefinance
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-2.5-flash
      - DEFAULT_DATA_MODE=cached
      - DEFAULT_USER_ID=meena
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: vibefinance-web
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:

